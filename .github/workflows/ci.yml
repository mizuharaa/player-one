name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-22.04
    # The store tests skip without DATABASE_URL, which would make them decoration.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: playerone }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:playerone@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
