  <body>
    <!--
      THESIS: A back office where every screen answers "is this footage worth
      money, and whose is it" in the same visual language the collector's phone
      speaks. It refuses the admin-console default — a grey sidebar over a table
      of rows — because the object under review is video, and video wants a
      theatre, not a cell.
      OWN-WORLD: Two brands doing two jobs. VNG's sun (#FF7A1A) is action and
      progress and nothing else; PaXini's tech blue (#1B6EF3) is data and system.
      Warm near-white grounds (#FBFAF9 / #FFFFFF), a 12–26px radius family,
      Plus Jakarta Sans with JetBrains Mono for every measured quantity. Three
      verdict colours that appear nowhere else, each carrying a shape as well as
      a hue. A near-black stage (#101215) wherever footage is on screen, in both
      themes. Cú the owl, four states read off the clock.
      STORY: A reviewer signs in, sees what the shift owes and what it has paid,
      and is one key away from the queue. A verdict never requires leaving the
      player.
      FIRST VIEWPORT: Top bar with the stereo-pair mark, pill nav, live queue
      and pace counters. Below it the shift gauge at the left with Cú inside it,
      the primary action ("Start reviewing", sun-filled, the only glow on the
      page) directly beneath, and three measured figures to its right in mono.
      FORM: Established world, inherited from the signed-off draft v2
      (D1a D2a D3a D4a D5b D6a). No direction roll: the world was chosen and
      approved before this build.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
